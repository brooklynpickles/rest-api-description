name: Docs CI

on:
  pull_request:
    paths:
      - "descriptions/api.github.com/api.github.com.yaml"
      - "docs/**"
  push:
    branches: [main]
    paths:
      - "descriptions/api.github.com/api.github.com.yaml"
      - "docs/**"

jobs:
  lint-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx @stoplight/spectral-cli lint descriptions/api.github.com/api.github.com.yaml --ruleset tooling/.spectral.yaml

  lint-prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: errata-ai/vale-action@v2
        with:
          files: docs
          styles: tooling/styles

  draft-docs-from-spec-change:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: git show HEAD~1:descriptions/api.github.com/api.github.com.yaml > /tmp/old-spec.yaml || true
      - name: Draft docs update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 tooling/scripts/draft_docs_from_diff.py \
            --old-spec /tmp/old-spec.yaml \
            --new-spec descriptions/api.github.com/api.github.com.yaml \
            --doc docs/using-the-description.md \
            --out docs/using-the-description.md \
            --product-name "GitHub REST API"
      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: draft update from spec change"
          title: "[auto-draft] Update docs for spec change"
          body: "Opened automatically from a spec diff. Needs human review before merge."
          branch: auto/docs-draft

  sync-to-docs-site:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docs-sync to the aggregator site
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.DOCS_SYNC_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/brooklynpickles/docs-pipeline-site/dispatches \
            -d '{"event_type":"docs-sync","client_payload":{"repo":"rest-api-description","ref":"main","product_dir":"github-rest-api","label":"GitHub REST API","position":2}}'
